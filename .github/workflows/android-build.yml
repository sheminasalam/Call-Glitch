name: Android and Web CI

on:
  push:
    branches:
      - main
      - fix/real-forwarding-foundation
      - 'feature/**'
  pull_request:
    branches:
      - main
      - fix/real-forwarding-foundation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Android project presence
        run: |
          echo "Validating Android Studio project files in android/..."
          test -f android/settings.gradle.kts || { echo "Missing android/settings.gradle.kts"; exit 1; }
          test -f android/gradle.properties || { echo "Missing android/gradle.properties"; exit 1; }
          test -f android/gradlew || { echo "Missing android/gradlew"; exit 1; }
          test -f android/gradle/wrapper/gradle-wrapper.jar || { echo "Missing android/gradle/wrapper/gradle-wrapper.jar"; exit 1; }
          test -f android/app/build.gradle.kts || { echo "Missing android/app/build.gradle.kts"; exit 1; }
          echo "All core Android project files verified."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: call-glitch-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  web-build:
    name: Web Workbench Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript lint check
        run: bun run lint

      - name: Build Web Workbench
        run: bun run build
